# Deploy
#
# Runs ONLY on push to main (or manual dispatch), and ONLY after the full CI
# suite (lint, typecheck, unit tests, build, E2E) has passed — the `tests`
# job below reuses .github/workflows/ci.yml via workflow_call.
#
# Both apps ship to Vercel as TWO separate projects built from this one
# monorepo (web + API). Every deploy runs from the repo root with
# `--archive=tgz`: the Hobby plan rejects uploads of thousands of individual
# files, and Vercel resolves each project's Root Directory (apps/web or
# apps/api) relative to the directory the CLI runs in.
#
# ── Required repository secrets (Settings → Secrets and variables → Actions) ─
#   VERCEL_TOKEN            https://vercel.com/account/tokens — Full Account token
#                           (a team-scoped one can only see one of the two projects)
#   VERCEL_ORG_ID           team_BKDUdN2NAVI33dLrGVfWg911
#   VERCEL_WEB_PROJECT_ID   prj_iBqCOUZ7lzBE3VzJYBzw6s0wVDP0
#   VERCEL_API_PROJECT_ID   prj_NXm9Iwbu76NU0D3TqoRWCRpKaXjo
#
# ── Optional secrets ────────────────────────────────────────────────────────
#   DATABASE_URL            pooled Postgres URL — enables the schema step
#   DATABASE_URL_UNPOOLED   direct URL used by the Prisma CLI
#
# Without the Vercel secrets each job skips itself and says so in the log, so a
# fork or an unconfigured clone still goes green. NEVER hardcode tokens, keys
# or database URLs in this file.

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: false

# Read secrets once; empty strings let each job below skip itself instead of
# crashing CLI tools with e.g. `--token=` (GitHub's `if` can read workflow-level env).
env:
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_WEB_PROJECT_ID: ${{ secrets.VERCEL_WEB_PROJECT_ID }}
  VERCEL_API_PROJECT_ID: ${{ secrets.VERCEL_API_PROJECT_ID }}
  VERCEL_CLI_VERSION: "65"

jobs:
  # ── Gate: full CI suite (unit + e2e) must be green before deploying ────────
  tests:
    uses: ./.github/workflows/ci.yml

  # ── API (Express + Prisma → Vercel serverless function) ────────────────────
  deploy-api:
    name: Deploy API
    needs: tests
    runs-on: ubuntu-latest
    environment: production # optional: add environment protection rules in GitHub
    env:
      # Vercel CLI 65+ requires PROJECT_ID whenever ORG_ID is set globally,
      # even when .vercel/project.json exists. Without this the deploy fails
      # with "You specified VERCEL_ORG_ID but forgot VERCEL_PROJECT_ID".
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_API_PROJECT_ID }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      # Direct (non-pooler) URL for the Prisma CLI. Falls back to DATABASE_URL
      # when the repo has no pooler (e.g. plain Postgres).
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED || secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate Vercel secrets
        if: ${{ env.VERCEL_TOKEN != '' && env.VERCEL_API_PROJECT_ID != '' }}
        run: |
          case "$VERCEL_TOKEN" in
            team_*)
              echo "::error::VERCEL_TOKEN is an org ID (starts with team_), not a Vercel access token. Create one at https://vercel.com/account/tokens and replace the repository secret."
              exit 1
              ;;
          esac
          echo "Vercel token format looks valid; org and API project ID are set."

      - name: Skip notice (no Vercel token / API project id)
        if: ${{ env.VERCEL_TOKEN == '' || env.VERCEL_API_PROJECT_ID == '' }}
        run: |
          echo "VERCEL_TOKEN or VERCEL_API_PROJECT_ID is not configured — skipping the API deploy."
          echo "Add both repository secrets (see the header of .github/workflows/deploy.yml) to enable it."

      - uses: actions/setup-node@v4
        if: ${{ env.VERCEL_TOKEN != '' && env.VERCEL_API_PROJECT_ID != '' }}
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        if: ${{ env.VERCEL_TOKEN != '' && env.VERCEL_API_PROJECT_ID != '' }}
        run: npm ci

      # ── Database schema on every deploy ──────────────────────────────────
      # Migrations are committed (apps/api/prisma/migrations/) and CI already
      # replays them on an empty database, so production only needs the
      # pending ones. Kept behind the DATABASE_URL guard so the job skips
      # cleanly when the DB credentials are not in GitHub.
      - name: Apply database migrations
        if: ${{ env.DATABASE_URL != '' }}
        run: npx prisma migrate deploy --schema apps/api/prisma/schema.prisma

      # `.vercel/` is gitignored, so the link is written here instead of
      # relying on a local project.json. Overwriting it also guarantees the API
      # deploy can never land in the web project by accident.
      - name: Link the API project
        if: ${{ env.VERCEL_TOKEN != '' && env.VERCEL_API_PROJECT_ID != '' }}
        run: |
          mkdir -p .vercel
          printf '{"projectId":"%s","orgId":"%s"}' "$VERCEL_API_PROJECT_ID" "$VERCEL_ORG_ID" > .vercel/project.json

      - name: Install Vercel CLI
        if: ${{ env.VERCEL_TOKEN != '' && env.VERCEL_API_PROJECT_ID != '' }}
        run: npm install --global "vercel@$VERCEL_CLI_VERSION"

      - name: Deploy API to Vercel
        if: ${{ env.VERCEL_TOKEN != '' && env.VERCEL_API_PROJECT_ID != '' }}
        run: |
          set +e
          vercel deploy --prod --archive=tgz --yes --token "$VERCEL_TOKEN" > vercel-api.log 2>&1
          code=$?
          sed "s/$VERCEL_TOKEN/***/g" vercel-api.log
          {
            echo "### API deploy output (exit $code)"
            echo '```'
            sed "s/$VERCEL_TOKEN/***/g" vercel-api.log | tail -n 40
            echo '```'
            echo "### API — https://islamic-event-api.vercel.app"
          } >> "$GITHUB_STEP_SUMMARY"
          exit $code

      - name: Smoke-test the deployed API
        if: ${{ env.VERCEL_TOKEN != '' && env.VERCEL_API_PROJECT_ID != '' }}
        run: |
          code=""
          for attempt in $(seq 1 10); do
            code=$(curl -s -o /dev/null -w '%{http_code}' https://islamic-event-api.vercel.app/api/v1/health || true)
            if [ "$code" = "200" ]; then
              echo "API health check passed (attempt $attempt)"
              exit 0
            fi
            echo "attempt $attempt: /api/v1/health returned $code — retrying"
            sleep 6
          done
          echo "::error::API health check failed — last status $code"
          exit 1

  # ── Web (Next.js → Vercel) ─────────────────────────────────────────────────
  # NEXT_PUBLIC_* variables must be set in the Vercel project settings (they are
  # inlined at build time), not only as runtime env.
  # NOTE: job-level `if` cannot use the `env` context (that made this workflow
  # fail validation with 0 jobs), so the skip checks live in step-level
  # conditions.
  deploy-web:
    name: Deploy Web
    needs: tests
    runs-on: ubuntu-latest
    environment: production
    env:
      # See deploy-api: CLI 65+ needs both ORG_ID and PROJECT_ID in the env.
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_WEB_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate Vercel secrets
        if: ${{ env.VERCEL_TOKEN != '' && env.VERCEL_WEB_PROJECT_ID != '' }}
        run: |
          case "$VERCEL_TOKEN" in
            team_*)
              echo "::error::VERCEL_TOKEN is an org ID (starts with team_), not a Vercel access token. Create one at https://vercel.com/account/tokens and replace the repository secret."
              exit 1
              ;;
          esac
          echo "Vercel token format looks valid; org and web project ID are set."

      - name: Skip notice (no Vercel token / web project id)
        if: ${{ env.VERCEL_TOKEN == '' || env.VERCEL_WEB_PROJECT_ID == '' }}
        run: |
          echo "VERCEL_TOKEN or VERCEL_WEB_PROJECT_ID is not configured — skipping the web deploy."
          echo "Add both repository secrets (see the header of .github/workflows/deploy.yml) to enable it."

      - uses: actions/setup-node@v4
        if: ${{ env.VERCEL_TOKEN != '' && env.VERCEL_WEB_PROJECT_ID != '' }}
        with:
          node-version: 20

      - name: Link the web project
        if: ${{ env.VERCEL_TOKEN != '' && env.VERCEL_WEB_PROJECT_ID != '' }}
        run: |
          mkdir -p .vercel
          printf '{"projectId":"%s","orgId":"%s"}' "$VERCEL_WEB_PROJECT_ID" "$VERCEL_ORG_ID" > .vercel/project.json

      - name: Install Vercel CLI
        if: ${{ env.VERCEL_TOKEN != '' && env.VERCEL_WEB_PROJECT_ID != '' }}
        run: npm install --global "vercel@$VERCEL_CLI_VERSION"

      - name: Deploy web to Vercel
        if: ${{ env.VERCEL_TOKEN != '' && env.VERCEL_WEB_PROJECT_ID != '' }}
        run: |
          set +e
          vercel deploy --prod --archive=tgz --yes --token "$VERCEL_TOKEN" > vercel-web.log 2>&1
          code=$?
          sed "s/$VERCEL_TOKEN/***/g" vercel-web.log
          {
            echo "### Web deploy output (exit $code)"
            echo '```'
            sed "s/$VERCEL_TOKEN/***/g" vercel-web.log | tail -n 40
            echo '```'
            echo "### Web — https://islamic-event-web.vercel.app"
          } >> "$GITHUB_STEP_SUMMARY"
          exit $code

      - name: Smoke-test the deployed site
        if: ${{ env.VERCEL_TOKEN != '' && env.VERCEL_WEB_PROJECT_ID != '' }}
        run: |
          code=""
          for attempt in $(seq 1 10); do
            code=$(curl -s -o /dev/null -w '%{http_code}' https://islamic-event-web.vercel.app/ || true)
            if [ "$code" = "200" ]; then
              echo "Web health check passed (attempt $attempt)"
              exit 0
            fi
            echo "attempt $attempt: / returned $code — retrying"
            sleep 6
          done
          echo "::error::Web health check failed — last status $code"
          exit 1
