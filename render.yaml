# ─────────────────────────────────────────────────────────────────────────────
# Render Blueprint — API only (free plan).
#
#   Render Dashboard → New → Blueprint → pick this repo → Apply.
#   Values marked `sync: false` are prompted for in the dashboard and are never
#   stored in git. Everything else is baked in below.
#
# The database is NOT created here: Render's free Postgres expires after 30
# days, so use Neon's free plan instead (see docs/DEPLOY-FREE.md).
#
# ⚠️ Render free web services block outbound SMTP on ports 25 / 465 / 587.
# Use a relay that listens on 2525 (Brevo) — Gmail's smtp.gmail.com:465 will
# hang/fail here. Details in docs/DEPLOY-FREE.md.
# ─────────────────────────────────────────────────────────────────────────────
services:
  - type: web
    name: community-events-api
    runtime: docker
    plan: free
    # Closest Render region to Pakistan. Move the Neon DB to the same region
    # to keep query latency low.
    region: singapore
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production

      - key: API_PREFIX
        value: /api/v1

      # Neon connection string, e.g.
      # postgresql://user:pass@ep-xxx.ap-southeast-1.aws.neon.tech/neondb?sslmode=require
      # Use the DIRECT (non -pooler) host for this long-running server process.
      - key: DATABASE_URL
        sync: false

      # Generated by Render at service creation (256-bit random each).
      # Production requires >= 32 chars, differing values, non-placeholder.
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d

      # Cloudinary free plan — required at boot (config validation fails without
      # them) and for event image uploads.
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

      # Exact browser origin of the Vercel deployment, e.g.
      # https://islamic-event.vercel.app  (no trailing slash, add custom domains
      # comma-separated). The web app calls the API directly from the browser.
      - key: CORS_ORIGINS
        sync: false

      # Base URL used inside verification / password-reset links.
      # Must be the public web URL, e.g. https://islamic-event.vercel.app
      - key: APP_URL
        sync: false
      - key: SUPPORT_EMAIL
        sync: false

      # ── Email (nodemailer) ────────────────────────────────────────────────
      # Brevo free plan (300 emails/day): smtp-relay.brevo.com : 2525, secure=false.
      # Leave SMTP_HOST empty to fall back to the dev outbox (emails are written
      # to disk instead of sent — NOT delivered on Render).
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "2525"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      # Gmail requires From to equal the authenticated mailbox; for Brevo use a
      # verified sender. Defaults to "Community Events <SMTP_USER>" when unset.
      - key: EMAIL_FROM
        sync: false
